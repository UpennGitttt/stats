<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Stats 云服务器菜单栏列表 UI 原型">
  <title>Stats · 服务器</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #e9eaed;
      --panel: rgba(248, 248, 250, 0.96);
      --hover: rgba(0, 0, 0, 0.045);
      --label: #1d1d1f;
      --secondary: #707075;
      --separator: rgba(0, 0, 0, 0.1);
      --accent: #007aff;
      --online: #28a745;
      --warning: #d88600;
      --error: #d70015;
      --shadow: 0 14px 36px rgba(40, 44, 54, 0.18), 0 2px 8px rgba(40, 44, 54, 0.06);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #191a1d;
      --panel: rgba(37, 37, 40, 0.96);
      --hover: rgba(255, 255, 255, 0.065);
      --label: #f2f2f4;
      --secondary: #9b9ba0;
      --separator: rgba(255, 255, 255, 0.105);
      --accent: #0a84ff;
      --online: #30d158;
      --warning: #ffd60a;
      --error: #ff453a;
      --shadow: 0 16px 42px rgba(0, 0, 0, 0.44), 0 2px 8px rgba(0, 0, 0, 0.24);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 340px;
      min-height: 100vh;
      background: var(--canvas);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 13px;
    }

    button { font: inherit; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .appearance { position: fixed; right: 20px; bottom: 20px; }
    .appearance button {
      min-height: 28px;
      padding: 0 8px;
      border: 0;
      background: transparent;
      color: var(--secondary);
      font-size: 11px;
      cursor: pointer;
    }
    .appearance button:hover { color: var(--label); }

    .stage { position: relative; width: min(1040px, 100%); min-height: 560px; margin: 0 auto; }

    .menubar {
      position: absolute;
      inset: 0 0 auto;
      height: 32px;
      border-bottom: 1px solid var(--separator);
      background: var(--panel);
      color: var(--secondary);
      font-size: 12px;
    }

    .menu-left { display: flex; align-items: center; gap: 20px; height: 100%; padding-left: 20px; }
    .menu-left strong { color: var(--label); font-weight: 600; }

    .stats-widget {
      position: absolute;
      top: 4px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 7px;
      border-radius: 5px;
      background: var(--hover);
      color: var(--label);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .status-dot { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: var(--online); }
    .status-dot.warning { background: var(--warning); }
    .status-dot.error { background: var(--error); }

    .popover {
      position: absolute;
      top: 40px;
      right: 12px;
      width: 600px;
      overflow: hidden;
      border: 1px solid var(--separator);
      border-radius: 11px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(130%);
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 45px;
      padding: 0 15px;
    }

    .panel-title { display: flex; align-items: baseline; gap: 8px; }
    .panel-title strong { font-size: 13px; font-weight: 600; }
    .panel-title span, .fleet-status { color: var(--secondary); font-size: 11px; }
    .fleet-status { font-variant-numeric: tabular-nums; }

    .list-head, .server-row {
      display: grid;
      grid-template-columns: minmax(140px, 1.45fr) repeat(3, minmax(58px, 0.66fr)) 65px 8px;
      column-gap: 12px;
      align-items: center;
    }

    .list-head {
      min-height: 28px;
      padding: 0 15px;
      border-top: 1px solid var(--separator);
      border-bottom: 1px solid var(--separator);
      color: var(--secondary);
      font-size: 10px;
    }

    .list-head span:not(:first-child) { text-align: right; }
    .server-list { max-height: 336px; overflow-y: auto; overscroll-behavior: contain; }

    .server-row {
      width: 100%;
      min-height: 62px;
      padding: 8px 15px;
      border: 0;
      border-bottom: 1px solid var(--separator);
      background: transparent;
      color: var(--label);
      text-align: left;
      cursor: pointer;
    }

    .server-row:last-child { border-bottom: 0; }
    .server-row:hover, .server-row:focus-visible { background: var(--hover); }

    .host-cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .host-copy { min-width: 0; }
    .host-copy strong { display: block; overflow: hidden; font-size: 13px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
    .host-copy small { display: block; overflow: hidden; margin-top: 3px; color: var(--secondary); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .error-text { color: var(--error) !important; }

    .metric-cell { min-width: 0; text-align: right; }
    .metric-value { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
    .metric-value.warning { color: var(--warning); }
    .metric-value.error { color: var(--error); }

    .latency-cell { text-align: right; font-variant-numeric: tabular-nums; }
    .latency-cell strong { display: block; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 11px; font-weight: 400; }
    .latency-cell small { display: block; margin-top: 4px; color: var(--secondary); font-size: 9px; white-space: nowrap; }
    .row-chevron { color: var(--secondary); opacity: 0; transition: opacity 120ms ease; }
    .server-row:hover .row-chevron, .server-row:focus-visible .row-chevron { opacity: 1; }

    .panel-footer {
      display: grid;
      grid-template-columns: 1fr auto 26px;
      align-items: center;
      gap: 9px;
      min-height: 41px;
      padding: 5px 10px 5px 14px;
      border-top: 1px solid var(--separator);
    }

    .footer-button {
      width: fit-content;
      min-height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--secondary);
      font-size: 11px;
      cursor: pointer;
    }

    .footer-button:hover { color: var(--label); }
    .updated { color: var(--secondary); font-size: 10px; white-space: nowrap; }

    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--secondary);
      cursor: pointer;
    }

    .icon-button:hover { background: var(--hover); color: var(--label); }
    .icon-button.loading svg { animation: spin 650ms linear infinite; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      max-width: calc(100vw - 32px);
      padding: 8px 12px;
      border: 1px solid var(--separator);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: var(--label);
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 6px);
      transition: opacity 140ms ease, transform 140ms ease;
    }

    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 660px) {
      .menu-left { gap: 12px; padding-left: 13px; }
      .menu-left span:last-child { display: none; }
      .stats-widget { right: 9px; }
      .popover { right: 9px; left: 9px; width: auto; }
      .list-head { display: none; }
      .server-row { grid-template-columns: minmax(108px, 1.35fr) repeat(3, minmax(43px, 0.65fr)) 8px; column-gap: 7px; padding-right: 12px; padding-left: 12px; }
      .latency-cell { display: none; }
      .metric-cell::before { display: block; margin-bottom: 3px; color: var(--secondary); content: attr(data-label); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-size: 8px; }
      .row-chevron { opacity: 0.6; }
      .appearance { right: 10px; bottom: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="appearance"><button id="themeToggle" type="button" aria-label="切换到浅色外观"><span id="themeLabel">浅色</span></button></div>

  <main class="stage">
    <div class="menubar" aria-label="macOS 菜单栏示意">
      <div class="menu-left"><strong>Stats</strong><span>本机 12%</span><span>内存 38%</span></div>
      <div class="stats-widget"><span class="status-dot warning"></span><span>服务器 2/3 在线</span></div>
    </div>

    <section class="popover" aria-label="全部服务器">
      <header class="panel-heading">
        <div class="panel-title"><strong>服务器</strong><span>10 秒刷新</span></div>
        <div class="fleet-status">2/3 在线</div>
      </header>

      <div class="list-head" aria-hidden="true"><span>主机</span><span>CPU</span><span>内存</span><span>磁盘 /</span><span>延迟</span><span></span></div>
      <div class="server-list" id="serverList" aria-label="服务器列表"></div>

      <footer class="panel-footer">
        <button class="footer-button" id="addButton" type="button">管理服务器…</button>
        <span class="updated" id="updatedLabel">刚刚更新</span>
        <button class="icon-button" id="refreshButton" type="button" aria-label="立即刷新"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M6.1 9a7 7 0 0 1 11.6-3L20 11M4 13l2.3 5a7 7 0 0 0 11.6-3"/></svg></button>
      </footer>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const servers = [
      { id: "hk", name: "prod-hk-01", os: "Ubuntu 24.04", address: "10.0.0.12", status: "online", cpu: 23.8, memory: 61.4, disk: 68.2, latency: "38 ms", updated: "刚刚" },
      { id: "sg", name: "prod-sg-02", os: "Debian 13", address: "10.0.0.18", status: "online", cpu: 72.1, memory: 80.3, disk: 47.8, latency: "74 ms", updated: "2 秒前" },
      { id: "backup", name: "backup-01", os: "Ubuntu 22.04", address: "10.0.1.9", status: "error", cpu: 14.2, memory: 48.6, disk: 91.7, latency: "超时", updated: "3 分钟前" }
    ];

    const byId = id => document.getElementById(id);
    let toastTimer;

    function metricCell(label, value, kind = "") {
      return `<div class="metric-cell" data-label="${label}"><strong class="metric-value ${kind}">${value.toFixed(1)}%</strong></div>`;
    }

    function diskCell(value) {
      const kind = value >= 90 ? "error" : value >= 75 ? "warning" : "";
      return metricCell("磁盘", value, kind);
    }

    function renderServers() {
      byId("serverList").innerHTML = "";
      servers.forEach(server => {
        const failed = server.status === "error";
        const row = document.createElement("button");
        row.type = "button";
        row.className = "server-row";
        row.id = `server-${server.id}`;
        row.setAttribute("aria-label", `${server.name}，CPU ${server.cpu}%，内存 ${server.memory}%，磁盘 ${server.disk}%，${failed ? "采集失败" : "在线"}`);
        row.innerHTML = `
          <div class="host-cell"><span class="status-dot ${failed ? "error" : ""}"></span><div class="host-copy"><strong>${server.name}</strong><small class="${failed ? "error-text" : ""}">${failed ? "采集失败 · 最后快照" : `${server.os} · ${server.address}`}</small></div></div>
          ${metricCell("CPU", server.cpu)}
          ${metricCell("内存", server.memory)}
          ${diskCell(server.disk)}
          <div class="latency-cell"><strong class="${failed ? "error-text" : ""}">${server.latency}</strong><small>${server.updated}</small></div>
          <svg class="row-chevron" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>`;
        row.addEventListener("click", () => showToast(`${server.name}：正式版将在这里展开详细信息`));
        byId("serverList").appendChild(row);
      });
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      byId("toast").textContent = message;
      byId("toast").classList.add("visible");
      toastTimer = setTimeout(() => byId("toast").classList.remove("visible"), 2200);
    }

    byId("themeToggle").addEventListener("click", () => {
      const dark = document.documentElement.dataset.theme === "dark";
      document.documentElement.dataset.theme = dark ? "light" : "dark";
      byId("themeLabel").textContent = dark ? "深色" : "浅色";
      byId("themeToggle").setAttribute("aria-label", dark ? "切换到深色外观" : "切换到浅色外观");
    });

    byId("addButton").addEventListener("click", () => showToast("正式版将在这里打开服务器设置"));
    byId("refreshButton").addEventListener("click", () => {
      const button = byId("refreshButton");
      button.classList.add("loading");
      button.disabled = true;
      byId("updatedLabel").textContent = "正在采集…";
      setTimeout(() => {
        button.classList.remove("loading");
        button.disabled = false;
        byId("updatedLabel").textContent = "刚刚更新";
        showToast("演示数据已刷新");
      }, 650);
    });

    renderServers();
  </script>
</body>
</html>
